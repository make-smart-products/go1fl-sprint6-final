name: hourly sports data refresh

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Refresh sports data snapshot
        run: python3 scripts/update_sports_data.py

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/sports-stats.json; then
            echo "No sports data changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sports-stats.json
          git commit -m "Refresh sports statistics data"
          git push
